<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pink Firework Christmas Tree · Zhang Aoyun</title>
<style>
  :root{
    --bg:#07070d;
    --panel:#0d101c;
    --panel-border:rgba(255,179,212,.12);
    --pink:#ffb3d4;
    --pink-deep:#f06ba5;
    --pearl:#ffe9f3;
    --muted:rgba(255,228,240,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--pearl)}
  .wrap{display:flex;width:100%;height:100%}

  /* ---------- 左侧代码面板 ---------- */
  .code-panel{
    width:400px;min-width:320px;height:100%;background:var(--panel);
    border-right:1px solid var(--panel-border);display:flex;flex-direction:column;
    z-index:5;
  }
  .code-head{
    padding:12px 16px;border-bottom:1px solid var(--panel-border);
    display:flex;align-items:center;gap:8px;
  }
  .code-head .dots{display:flex;gap:6px}
  .code-head .dots i{width:10px;height:10px;border-radius:50%;display:block}
  .code-head .fname{margin-left:8px;font-size:12px;color:var(--muted);font-family:Consolas,monospace}
  .code-body{flex:1;overflow:auto;padding:14px 0;font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.7}
  .cline{display:flex;gap:14px;padding:0 16px;white-space:pre}
  .cline .ln{width:22px;text-align:right;color:rgba(255,255,255,.22);user-select:none;flex:none}
  .cline .src{flex:1;white-space:pre-wrap;word-break:break-word}
  .tok-kw{color:#f06ba5}
  .tok-str{color:#f2c14e}
  .tok-com{color:rgba(255,255,255,.32);font-style:italic}
  .tok-num{color:#7db4ff}
  .tok-fn{color:#ffb3d4}

  /* ---------- 右侧舞台 ---------- */
  .stage{position:relative;flex:1;height:100%}
  #scene{position:absolute;inset:0;display:block}

  /* ---------- 底部文字 ---------- */
  .caption{
    position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
    z-index:10;text-align:center;pointer-events:none;
  }
  .caption .en{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;
    font-size:clamp(30px,3.6vw,44px);white-space:nowrap;
    background:linear-gradient(120deg,#fff0f7 10%,var(--pink) 55%,#e86a9c 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 28px rgba(255,158,198,.25);
  }
  .caption .name{
    margin-top:6px;font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:clamp(18px,2.2vw,26px);color:var(--pearl);letter-spacing:.08em;
    text-shadow:0 0 18px rgba(255,158,198,.35);
  }
  .badge{position:absolute;top:18px;right:22px;z-index:10;font-size:11px;color:var(--muted);letter-spacing:.18em}

  @media (max-width:860px){
    .code-panel{position:absolute;left:0;top:0;bottom:0;width:230px;opacity:.85}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 左侧：同款代码展示 -->
  <aside class="code-panel">
    <div class="code-head">
      <span class="dots"><i style="background:#e0566a"></i><i style="background:#f2c14e"></i><i style="background:#37d67a"></i></span>
      <span class="fname">main.js · LoveHeartApp</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </aside>

  <!-- 右侧：烟花圣诞树动画 -->
  <main class="stage">
    <canvas id="scene"></canvas>
    <div class="badge">PINK FIREWORK TREE</div>
    <div class="caption">
      <div class="en">Merry Christmas</div>
      <div class="name">Zhang Aoyun</div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  /* ================= 源码展示（左侧代码面板） ================= */
  const SOURCE = [
    '// LoveHeartApp · pink firework Christmas tree',
    'class TreeApp {',
    '  constructor(canvas) {',
    '    this.ctx = canvas.getContext("2d");',
    '    this.particles = [];   // 树身粉色光斑',
    '    this.baubles   = [];   // 彩色装饰球',
    '    this.fireworks  = [];   // 升空烟花',
    '    this.strands    = 6;    // 螺旋光带股数',
    '  }',
    '',
    '  buildTree() {',
    '    for (let i = 0; i < 900; i++) {',
    '      const t = Math.pow(Math.random(), .72);',
    '      const theta = Math.random() * Math.PI * 2;',
    '      this.particles.push({ t, theta, size: Math.random()*1.4+.7 });',
    '    }',
    '    // 点缀彩球：绿 / 红 / 蓝 / 琥珀，颜色保持不变',
    '    const colors = ["#37d67a","#e0566a","#7db4ff","#f2c14e"];',
    '    for (let i = 0; i < 80; i++) {',
    '      this.baubles.push({',
    '        t: Math.random(), theta: Math.random()*Math.PI*2,',
    '        color: colors[i % colors.length],',
    '        phase: Math.random()*Math.PI*2,',
    '      });',
    '    }',
    '  }',
    '',
    '  launchFirework(x) {',
    '    this.fireworks.push({',
    '      x, y: this.groundY, vy: -(6+Math.random()*3),',
    '      targetY: this.height * (.18+Math.random()*.25),',
    '      burst: false,',
    '    });',
    '  }',
    '',
    '  explode(fw) {',
    '    for (let i = 0; i < 46; i++) {',
    '      const a = Math.random()*Math.PI*2;',
    '      const v = 1+Math.random()*3.2;',
    '      this.sparks.push({',
    '        x: fw.x, y: fw.y,',
    '        vx: Math.cos(a)*v, vy: Math.sin(a)*v,',
    '        life: 1, color: pickPink(),',
    '      });',
    '    }',
    '  }',
    '',
    '  draw(now) {',
    '    this.drawHelices();   // 粉色螺旋光带',
    '    this.drawParticles(); // 粉色粒子光斑',
    '    this.drawBaubles();   // 彩色装饰球',
    '    this.drawStar();      // 树顶星芒',
    '    this.updateFireworks();',
    '    requestAnimationFrame(this.draw.bind(this));',
    '  }',
    '}',
    '',
    'const app = new TreeApp(document.getElementById("scene"));',
    'app.buildTree();',
    'app.draw(0);',
  ];

  function esc(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function highlight(line){
    if(/^\s*\/\//.test(line)) return `<span class="tok-com">${esc(line)}</span>`;
    const re = /(\/\/.*)|("(?:[^"\\]|\\.)*")|\b(const|let|var|function|return|for|if|else|class|new|this|bind|push)\b|\b(\d+(?:\.\d+)?)\b/g;
    let out = "", last = 0, m;
    while((m = re.exec(line))){
      out += esc(line.slice(last, m.index));
      if(m[1])      out += `<span class="tok-com">${esc(m[1])}</span>`;
      else if(m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
      else if(m[3]) out += `<span class="tok-kw">${esc(m[3])}</span>`;
      else if(m[4]) out += `<span class="tok-num">${esc(m[4])}</span>`;
      last = re.lastIndex;
    }
    out += esc(line.slice(last));
    return out;
  }
  const codeBody = document.getElementById("codeBody");
  SOURCE.forEach((line,i)=>{
    const row = document.createElement("div");
    row.className = "cline";
    row.innerHTML = `<span class="ln">${i+1}</span><span class="src">${highlight(line)}</span>`;
    codeBody.appendChild(row);
  });

  /* ================= 动画舞台 ================= */
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const stage = document.querySelector(".stage");
  let W=0, H=0, DPR=1, groundY=0, cx=0, TREE_H=0, TREE_R=0;

  const PINK = ["#ffb3d4","#f06ba5","#ffe9f3","#ff8fbf"];
  const BAUBLE_COLORS = ["#37d67a","#e0566a","#7db4ff","#f2c14e"]; // 点缀色不变

  const state = { time:0, rot:0, lastAuto:0 };

  let treeParts = [], baubles = [], sparks = [], shells = [], ambient = [];

  function buildTree(){
    treeParts = []; baubles = [];
    for(let i=0;i<900;i++){
      treeParts.push({
        t: Math.pow(Math.random(),.72),
        theta: Math.random()*Math.PI*2,
        rf: Math.sqrt(Math.random()),
        size: Math.random()*1.4+.7,
        warm: Math.random(),
      });
    }
    for(let i=0;i<80;i++){
      baubles.push({
        t: .06 + Math.random()*.9,
        theta: Math.random()*Math.PI*2,
        color: BAUBLE_COLORS[i % BAUBLE_COLORS.length],
        phase: Math.random()*Math.PI*2,
        size: 2.2+Math.random()*1.8,
      });
    }
    for(let i=0;i<60;i++){
      ambient.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*Math.PI*2,s:.4+Math.random()});
    }
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+"px"; canvas.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2; groundY = H*.8;
    TREE_H = H*.6; TREE_R = Math.min(W*.26, H*.3);
  }
  window.addEventListener("resize", resize);

  function pickPink(){ return PINK[Math.floor(Math.random()*PINK.length)]; }

  /* ---------- 树后柔光 ---------- */
  function drawGlow(){
    const g = ctx.createRadialGradient(cx, groundY-TREE_H*.45, 20, cx, groundY-TREE_H*.45, TREE_R*1.5);
    g.addColorStop(0, "rgba(255,158,198,.14)");
    g.addColorStop(1, "rgba(255,158,198,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  /* ---------- 树身螺旋光带 ---------- */
  function drawHelices(){
    const STRANDS = 7, TURNS = 3.0, SAMPLES = 120;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for(let s=0;s<STRANDS;s++){
      const baseAng = s/STRANDS*Math.PI*2;
      ctx.beginPath();
      for(let i=0;i<=SAMPLES;i++){
        const t = i/SAMPLES;
        const ang = baseAng + t*TURNS*Math.PI*2 + state.rot;
        const r = TREE_R*(1-t)*.95;
        const x = cx + Math.cos(ang)*r;
        const y = groundY - t*TREE_H;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle = "rgba(255,179,212,.42)";
      ctx.lineWidth = 1.4;
      ctx.shadowColor = "rgba(255,150,195,.55)";
      ctx.shadowBlur = 6;
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 树身粉色粒子光斑 ---------- */
  function drawParticles(){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for(const p of treeParts){
      const ang = p.theta + state.rot;
      const r = TREE_R*(1-p.t)*p.rf;
      const x = cx + Math.cos(ang)*r;
      const y = groundY - p.t*TREE_H;
      const depth = .55 + .45*((Math.sin(ang)+1)/2);
      ctx.globalAlpha = depth*(.65+.35*p.warm);
      ctx.fillStyle = p.warm > .85 ? "#f06ba5" : (p.warm > .3 ? "#ffb3d4" : "#ffe9f3");
      ctx.beginPath(); ctx.arc(x,y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- 彩色装饰球（颜色不变） ---------- */
  function drawBaubles(){
    ctx.save();
    for(const b of baubles){
      const ang = b.theta + state.rot;
      const r = TREE_R*(1-b.t)*.92;
      const x = cx + Math.cos(ang)*r;
      const y = groundY - b.t*TREE_H;
      const tw = .6 + .4*Math.sin(state.time*2 + b.phase);
      ctx.globalAlpha = tw;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(x,y,b.size,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.beginPath(); ctx.arc(x-b.size*.3,y-b.size*.3,b.size*.28,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- 树顶星芒 ---------- */
  function drawTopStar(){
    const sx = cx, sy = groundY - TREE_H - 18;
    const pulse = 1 + .12*Math.sin(state.time*3);
    const R = 16*pulse, r = R*.45;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    // 放射光线
    for(let i=0;i<12;i++){
      const ang = i/12*Math.PI*2 + state.time*.15;
      const len = R*(2.2+.5*Math.sin(state.time*2+i));
      ctx.strokeStyle = "rgba(255,220,236,.5)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(sx+Math.cos(ang)*R, sy+Math.sin(ang)*R);
      ctx.lineTo(sx+Math.cos(ang)*len, sy+Math.sin(ang)*len);
      ctx.stroke();
    }
    ctx.shadowColor = "#ffdcec"; ctx.shadowBlur = 26;
    ctx.fillStyle = "#ffe9f3";
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const ang = -Math.PI/2 + i*Math.PI/5;
      const rad = i%2===0 ? R : r;
      const x = sx+Math.cos(ang)*rad, y = sy+Math.sin(ang)*rad;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---------- 环境星点 ---------- */
  function drawAmbient(){
    ctx.save();
    for(const a of ambient){
      const tw = .4+.6*Math.sin(state.time*a.s+a.p);
      ctx.globalAlpha = .25+.5*tw;
      ctx.fillStyle = "#ffe9f3";
      ctx.beginPath(); ctx.arc(a.x*W, a.y*H, a.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- 烟花 ---------- */
  function launchFirework(x){
    shells.push({ x: x ?? (W*.2+Math.random()*W*.6), y: groundY, vy: -(6.2+Math.random()*2.6), targetY: H*(.18+Math.random()*.25), burst:false });
  }
  function explode(fw){
    for(let i=0;i<46;i++){
      const a = Math.random()*Math.PI*2;
      const v = 1+Math.random()*3.2;
      sparks.push({ x:fw.x, y:fw.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, color:pickPink() });
    }
  }
  function updateFireworks(dt){
    ctx.save();
    // 升空弹体
    shells = shells.filter(fw=>{
      fw.y += fw.vy; fw.vy += .06;
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#ffe9f3";
      ctx.beginPath(); ctx.arc(fw.x, fw.y, 2.2, 0, Math.PI*2); ctx.fill();
      if(fw.y <= fw.targetY || fw.vy >= -1){ explode(fw); return false; }
      return true;
    });
    // 爆炸火花
    sparks = sparks.filter(sp=>{
      sp.x += sp.vx; sp.y += sp.vy;
      sp.vx *= .985; sp.vy *= .985; sp.vy += .03;
      sp.life -= dt*.9;
      if(sp.life <= 0) return false;
      ctx.globalAlpha = Math.max(0, sp.life);
      ctx.fillStyle = sp.color;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 1.6, 0, Math.PI*2); ctx.fill();
      return true;
    });
    ctx.restore();
  }

  /* ---------- 主循环 ---------- */
  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    state.time += dt;
    state.rot += dt*.18;

    // 半透明覆盖形成拖尾
    ctx.fillStyle = "rgba(7,7,13,.22)";
    ctx.fillRect(0,0,W,H);

    drawAmbient();
    drawGlow();
    drawHelices();
    drawParticles();
    drawBaubles();
    drawTopStar();
    updateFireworks(dt);

    // 自动定时放烟花
    if(state.time - state.lastAuto > 2.4){ state.lastAuto = state.time; launchFirework(); }

    requestAnimationFrame(loop);
  }

  canvas.addEventListener("pointerdown", e=>{
    const r = canvas.getBoundingClientRect();
    launchFirework(e.clientX - r.left);
  });

  resize();
  buildTree();
  // 开场先放两发
  launchFirework(W*.3); launchFirework(W*.7);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
